[project]
name = "sb"
version = "0.1.0"
description = "Smart Buildings competition: transferable HVAC control policy"
requires-python = ">=3.12"
dependencies = ["numpy", "cma"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
